<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>流芳 · 关系驱动互动体验</title>
  <style>
    :root{--bg:#100d12;--panel:#1d171f;--panel2:#261d28;--line:#4b374b;--text:#f4ebef;--muted:#b7a6b2;--rose:#e3a1b7;--gold:#e5c28b;--teal:#9fc7bb;--danger:#d88483}
    *{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(circle at 80% 0,#553046 0,transparent 34%),radial-gradient(circle at 0 100%,#203c3a 0,transparent 31%),var(--bg);font:14px/1.65 Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input{font:inherit}button{cursor:pointer}.shell{width:min(1480px,calc(100% - 32px));margin:auto;padding:23px 0 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,#f3c6d2,#97728e);color:#261725;font-weight:900;font-size:23px}.title h1{margin:0;font-size:22px;letter-spacing:.02em}.title p{margin:3px 0 0;color:var(--muted);font-size:12px}.badges{display:flex;gap:8px}.badge{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#d3c4ce;font-size:11px}.badge.private{color:#f6c8d4;border-color:#98526f;background:#6b294322}.layout{display:grid;grid-template-columns:260px minmax(500px,1fr) 335px;gap:15px}.panel{background:#1b161fde;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #0007;backdrop-filter:blur(12px)}.side{padding:18px}.eyebrow{color:var(--rose);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}.case h2{font-size:25px;line-height:1.2;margin:0 0 8px}.case p{margin:0;color:var(--muted);font-size:12px}.divider{height:1px;background:var(--line);margin:17px 0}.flow{display:grid;gap:8px}.scene-btn,.npc,.quick button{border:1px solid var(--line);background:#ffffff06;color:#d9cbd4;border-radius:12px;text-align:left}.scene-btn{padding:10px}.scene-btn.active{border-color:#d17695;background:#9d4f702d;color:#fff}.scene-btn small{display:block;color:#948392;font-size:11px;margin-top:2px}.source-note{padding:10px 11px;border:1px solid #9b5f7733;background:#9b5f7714;border-radius:11px;color:#cbb8c2;font-size:11px}.center{min-height:750px;display:flex;flex-direction:column;overflow:hidden}.scene-head{display:flex;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}.scene-head h2{margin:0;font-size:17px}.scene-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.scene-head b{color:var(--gold);white-space:nowrap;font-size:12px}.selectors{display:flex;gap:8px;flex-wrap:wrap;padding:13px 20px 0}.select-wrap{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.select-wrap select{min-width:115px;border:1px solid var(--line);border-radius:9px;background:#120e14;color:var(--text);padding:8px 10px;outline:0}.chat{flex:1;min-height:390px;max-height:500px;overflow:auto;padding:18px 20px}.msg{display:flex;gap:10px;max-width:91%;margin-bottom:15px}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:11px;background:#dca7b9;color:#2b1723;font-weight:800}.avatar.sys{background:var(--teal);color:#18302c}.bubble{padding:10px 13px;border:1px solid #ffffff10;border-radius:5px 15px 15px 15px;background:#281e2b;color:#eee4e9;white-space:pre-wrap}.user .bubble{border-radius:15px 5px 15px 15px;background:#493047;border-color:#8e5678}.speaker{font-size:11px;color:#a995a3;margin-bottom:3px}.user .speaker{text-align:right}.quick{display:flex;flex-wrap:wrap;gap:7px;padding:0 20px 13px}.quick button{padding:8px 10px;font-size:12px}.quick button:hover{border-color:var(--rose)}.composer{display:flex;gap:9px;padding:14px 20px 19px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;background:#120e14;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0}.composer input:focus{border-color:var(--rose)}.send{border:0;border-radius:12px;padding:0 17px;background:var(--rose);color:#2c1523;font-weight:800}.right h3{margin:0 0 11px;font-size:14px}.npc-list{display:grid;gap:8px}.npc{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px}.npc.active{border-color:#c06d8b;background:#9d4f7028}.npc .avatar{width:30px;height:30px;border-radius:10px;font-size:12px}.npc .meta{min-width:0;flex:1}.npc strong{display:block;font-size:12px}.npc span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter{width:40px;height:5px;background:#493b4b;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;border-radius:99px;background:var(--rose)}.relationship{display:grid;gap:8px}.relation{padding:9px 10px;border:1px solid #ffffff0d;background:#ffffff05;border-radius:11px}.relation strong{display:block;color:#f0cfda;font-size:12px}.relation span{display:block;color:var(--muted);font-size:11px}.relation.focus{border-color:#b5768b;background:#9d4f701b}.bond{padding:10px 11px;border-left:3px solid var(--gold);background:#8a653019;border-radius:5px;color:#dbc8ae;font-size:11px}.footer{color:#897682;text-align:center;font-size:11px;margin-top:14px}.toast{position:fixed;right:22px;bottom:22px;padding:10px 13px;border:1px solid #836174;background:#211720;color:#f3dbe3;border-radius:11px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:1080px){.layout{grid-template-columns:230px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(max-width:720px){.shell{width:calc(100% - 18px);padding-top:14px}.top{align-items:flex-start}.badges{display:none}.layout{display:block}.side,.right{margin-bottom:12px}.right{display:block}.center{min-height:750px}.chat{max-height:520px}.scene-head{display:block}.scene-head b{display:block;margin-top:7px}}
  </style>
  <link rel="stylesheet" href="design.css">
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="mark">流</div><div class="title"><h1>流芳 · 关系驱动互动体验</h1><p>六个可选角色 · 五位核心 NPC · 四幕关系流转 · 本地私有试玩</p></div></div><div class="badges"><span class="badge private">本地私有模式</span><span class="badge" id="modelBadge" aria-live="polite">关系规则引擎已就绪</span></div></header>
  <main class="layout">
    <aside class="panel side case"><div class="eyebrow">story flow</div><h2>江阴 · 流芳</h2><p>把角色本、NPC 小传和 DM 的关系逻辑，整理成一张可玩的对话关系网。先选幕，再选谁和谁说话。</p><div class="divider"></div><div class="flow" id="flow"></div><div class="divider"></div><div class="source-note">本页使用的是根据本地资料提炼的角色规则，不展示剧本原文。正式公开前，请确认剧本版权与授权范围。</div></aside>
    <section class="panel center">
      <div class="scene-head"><div><h2 id="sceneTitle"></h2><p id="sceneDesc"></p></div><b id="phaseText"></b></div>
      <div class="selectors"><label class="select-wrap">说话者 <select id="speakerSelect"></select></label><label class="select-wrap">对话对象 <select id="listenerSelect"></select></label><span class="bond" id="relationHint">正在加载关系规则…</span></div>
      <div class="chat" id="chat"></div>
      <div class="quick" id="quick"></div>
      <form class="composer" id="composer"><input id="input" maxlength="1000" placeholder="问问当前人物：你为什么这样对待我？" autocomplete="off"/><button class="send">发送</button></form>
    </section>
    <aside class="panel side right"><div class="eyebrow">cast & bonds</div><h3>选择 NPC 作为说话者</h3><div class="npc-list" id="npcList"></div><div class="divider"></div><h3>当前关系说明</h3><div class="relationship" id="relationship"></div></aside>
  </main>
  <div class="footer">《流芳》本地试玩适配 · 公开部署前请替换为获得授权的原创/授权内容</div>
</div>
<div class="toast" id="toast"></div>
<script src="catalog.js"></script>
<script src="common.js"></script>
<script src="investigation.js"></script>
<script src="liufang.js"></script>
</body>
</html>
