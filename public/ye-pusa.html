  <style>

ing:9px 10px;background:#ffffff05;border:1px solid #ffffff0d;border-radius:11px}.relation strong{display:block;font-size:12px;color:#f2d1da}.relation span{display:block;color:var(--muted);font-size:11px}.center{min-height:735px;display:flex;flex-direction:column;overflow:hidden}.scene-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.scene-head h2{font-size:16px;margin:0}.scene-head p{color:var(--muted);font-size:12px;margin:3px 0 0}.scene-head b{color:var(--gold);font-size:12px;white-space:nowrap}.chat{flex:1;max-height:515px;overflow:auto;padding:20px}.msg{display:flex;gap:10px;margin-bottom:16px;max-width:90%}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:33px;height:33px;flex:none;border-radius:11px;display:grid;place-items:center;background:#d9a1b4;color:#281825;font-weight:800}.avatar.sys{background:#a6c8bc}.bubble{padding:10px 13px;border:1px solid #ffffff10;border-radius:5px 15px 15px 15px;background:#281e2b;color:#eee2e8}.user .bubble{border-radius:15px 5px 15px 15px;background:#493047;border-color:#8e5678}.speaker{font-size:11px;color:#9f8d9c;margin-bottom:3px}.user .speaker{text-align:right}.quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px}.quick button,.send{border:1px solid var(--line);background:#302434;color:#e6d9e0;padding:8px 11px;border-radius:10px;font-size:12px}.quick button:hover{border-color:var(--rose)}.composer{display:flex;gap:9px;padding:14px 20px 19px;border-top:1px solid var(--line)}input{flex:1;min-width:0;background:#120f16;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0}input:focus{border-color:var(--rose)}.send{background:var(--rose);color:#2c1523;border:0;font-weight:700;padding:0 17px}.npc-list{display:grid;gap:8px}.npc{padding:10px;border-radius:13px;border:1px solid transparent;background:#ffffff05;display:flex;align-items:center;gap:9px;text-align:left;color:var(--text);width:100%}.npc.acti <div class="shell">
  <header class="top"><div class="brand"><div class="mark">菩</div><div class="title"><h1>野菩萨 · 情感本试玩</h1><p>8 人物关系 · 多章节对话 · 私有内容适配版</p></div></div><div class="badges"><span class="badge private">本地私有模式</span><span class="badge" id="modelBadge" aria-live="polite">规则引擎兜底</span></div></header>
  <main class="layout">
    <aside class="panel side case"><div class="eyebrow">story flow</div><h2>回到长平</h2><p>八个人被 1989 年的火光牵回同一张桌子。你可以选择一个人物，听他/她说话，也可以追问另一个人。</p><div class="divider"></div><div class="flow" id="flow"></div><div class="divider"></div><div class="source-note">这是根据你本地资料提炼的试玩数据，不包含原剧本文字、音频或海报。适合先验证“NPC 是否像这个人”。</div></aside>
    <section class="panel center"><div class="scene-head"><div><h2 id="sceneTitle">回到长平 · 旧日重逢</h2><p id="sceneDesc">车门打开前，所有人都还可以假装自己只是路过。</p></div><b id="phaseText">第一章</b></div><div class="chat" id="chat"></div><div class="ending" id="ending"><strong>关系变化</strong><span id="endingText"></span></div><div class="quick" id="quick"></div><form class="composer" id="composer"><input id="input" maxlength="1000" placeholder="问当前人物：你最怕谁记起什么？" autocomplete="off"/><button class="send">发送</button></form></section>
    <aside class="panel side right"><div class="eyebrow">cast & bonds</div><h3 style="margin:0 0 11px">选择对话人物</h3><div class="npc-list" id="npcList"></div><div class="divider"></div><h3 style="margin:0 0 11px">当前关系</h3><div class="relationship" id="relationship"></div></aside>
  </main>
