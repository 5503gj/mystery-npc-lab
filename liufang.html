  <style>
    :root{--bg:#100d12;--panel:#1d171f;--panel2:#261d28;--line:#4b374b;--text:#f4ebef;--muted:#b7a6b2;--rose:#e3a1b7;--gold:#e5c28b;--teal:#9fc7bb;--danger:#d88483}
    *{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(circle at 80% 0,#553046 0,transparent 34%),radial-gradient(circle at 0 100%,#203c3a 0,transparent 31%),var(--bg);font:14px/1.65 Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input{font:inherit}button{cursor:pointer}.shell{width:min(1480px,calc(100% - 32px));margin:auto;padding:23px 0 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,#f3c6d2,#97728e);color:#261725;font-weight:900;font-size:23px}.title h1{margin:0;font-size:22px;letter-spacing:.02em}.title p{margin:3px 0 0;color:var(--muted);font-size:12px}.badges{display:flex;gap:8px}.badge{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#d3c4ce;font-size:11px}.badge.private{color:#f6c8d4;border-color:#98526f;background:#6b294322}.layout{display:grid;grid-template-columns:260px minmax(500px,1fr) 335px;gap:15px}.panel{background:#1b161fde;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #0007;backdrop-filter:blur(12px)}.side{padding:18px}.eyebrow{color:var(--rose);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}.case h2{font-size:25px;line-height:1.2;margin:0 0 8px}.case p{margin:0;color:var(--muted);font-size:12px}.divider{height:1px;background:var(--line);margin:17px 0}.flow{display:grid;gap:8px}.scene-btn,.npc,.quick button{border:1px solid var(--line);background:#ffffff06;color:#d9cbd4;border-radius:12px;text-align:left}.scene-btn{padding:10px}.scene-btn.active{border-color:#d17695;background:#9d4f702d;color:#fff}.scene-btn small{display:block;color:#948392;font-size:11px;margin-top:2px}.source-note{padding:10px 11px;border:1px solid #9b5f7733;background:#9b5f7714;border-radius:11px;color:#cbb8c2;font-size:11px}.center{min-height:750px;display:flex;flex-direction:column;overflow:hidden}.scene-head{display:flex;justify-content:space-between;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}.scene-head h2{margin:0;font-size:17px}.scene-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.scene-head b{color:var(--gold);white-space:nowrap;font-size:12px}.selectors{display:flex;gap:8px;flex-wrap:wrap;padding:13px 20px 0}.select-wrap{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.select-wrap select{min-width:115px;border:1px solid var(--line);border-radius:9px;background:#120e14;color:var(--text);padding:8px 10px;outline:0}.chat{flex:1;min-height:390px;max-height:500px;overflow:auto;padding:18px 20px}.msg{display:flex;gap:10px;max-width:91%;margin-bottom:15px}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:11px;background:#dca7b9;color:#2b1723;font-weight:800}.avatar.sys{background:var(--teal);color:#18302c}.bubble{padding:10px 13px;border:1px solid #ffffff10;border-radius:5px 15px 15px 15px;background:#281e2b;color:#eee4e9;white-space:pre-wrap}.user .bubble{border-radius:15px 5px 15px 15px;background:#493047;border-color:#8e5678}.speaker{font-size:11px;color:#a995a3;margin-bottom:3px}.user .speaker{text-align:right}.quick{display:flex;flex-wrap:wrap;gap:7px;padding:0 20px 13px}.quick button{padding:8px 10px;font-size:12px}.quick button:hover{border-color:var(--rose)}.composer{display:flex;gap:9px;padding:14px 20px 19px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0;background:#120e14;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0}.composer input:focus{border-color:var(--rose)}.send{border:0;border-radius:12px;padding:0 17px;background:var(--rose);color:#2c1523;font-weight:800}.right h3{margin:0 0 11px;font-size:14px}.npc-list{display:grid;gap:8px}.npc{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px}.npc.active{border-color:#c06d8b;background:#9d4f7028}.npc .avatar{width:30px;height:30px;border-radius:10px;font-size:12px}.npc .meta{min-width:0;flex:1}.npc strong{display:block;font-size:12px}.npc span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter{width:40px;height:5px;background:#493b4b;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;border-radius:99px;background:var(--rose)}.relationship{display:grid;gap:8px}.relation{padding:9px 10px;border:1px solid #ffffff0d;background:#ffffff05;border-radius:11px}.relation strong{display:block;color:#f0cfda;font-size:12px}.relation span{display:block;color:var(--muted);font-size:11px}.relation.focus{border-color:#b5768b;background:#9d4f701b}.bond{padding:10px 11px;border-left:3px solid var(--gold);background:#8a653019;border-radius:5px;color:#dbc8ae;font-size:11px}.footer{color:#897682;text-align:center;font-size:11px;margin-top:14px}.toast{position:fixed;right:22px;bottom:22px;padding:10px 13px;border:1px solid #836174;background:#211720;color:#f3dbe3;border-radius:11px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:1080px){.layout{grid-template-columns:230px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(max-width:720px){.shell{width:calc(100% - 18px);padding-top:14px}.top{align-items:flex-start}.badges{display:none}.layout{display:block}.side,.right{margin-bottom:12px}.right{display:block}.center{min-height:750px}.chat{max-height:520px}.scene-head{display:block}.scene-head b{display:block;margin-top:7px}}

<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="mark">流</div><div class="title"><h1>流芳 · 关系驱动互动体验</h1><p>六个可选角色 · 五位核心 NPC · 四幕关系流转 · 本地私有试玩</p></div></div><div class="badges"><span class="badge private">本地私有模式</span><span class="badge" id="modelBadge">关系规则引擎已就绪</span></div></header>
  <main class="layout">
    <aside class="panel side case"><div class="eyebrow">story flow</div><h2>江阴 · 流芳</h2><p>把角色本、NPC 小传和 DM 的关系逻辑，整理成一张可玩的对话关系网。先选幕，再选谁和谁说话。</p><div class="divider"></div><div class="flow" id="flow"></div><div class="divider"></div><div class="source-note">本页使用的是根据本地资料提炼的角色规则，不展示剧本原文。正式公开前，请确认剧本版权与授权范围。</div></aside>
    <section class="panel center">
      <div class="scene-head"><div><h2 id="sceneTitle"></h2><p id="sceneDesc"></p></div><b id="phaseText"></b></div>
      <div class="selectors"><label class="select-wrap">说话者 <select id="speakerSelect"></select></label><label class="select-wrap">对话对象 <select id="listenerSelect"></select></label><span class="bond" id="relationHint">正在加载关系规则…</span></div>
      <div class="chat" id="chat"></div>
      <div class="quick" id="quick"></div>
      <form class="composer" id="composer"><input id="input" placeholder="问问当前人物：你为什么这样对待我？" autocomplete="off"/><button class="send">发送</button></form>
    </section>
    <aside class="panel side right"><div class="eyebrow">cast & bonds</div><h3>选择 NPC 作为说话者</h3><div class="npc-list" id="npcList"></div><div class="divider"></div><h3>当前关系说明</h3><div class="relationship" id="relationship"></div></aside>
  </main>
  <div class="footer">《流芳》本地试玩适配 · 公开部署前请替换为获得授权的原创/授权内容</div>
</div>
<div class="toast" id="toast"></div>
<script>
const NPCS={
  yang:{name:'杨小池',tag:'关宁会大当家 · 袁氏',voice:'果断、护短、外硬内热；谈到弟弟和冯厚敦时会把情绪压进做事里。',goal:'保护杨玉笙和关宁会，让身边的人活下去；不愿用自己的身份换取同情。'},
  chen:{name:'陈明遇',tag:'江阴典史 · 家族核心',voice:'表面克制稳重，内里强烈怕失去；面对不同家人会明显切换态度。',goal:'守住江阴和这个家，但容易把“保护”变成替别人做决定。'},
  yan:{name:'阎应元',tag:'陈家三郎 · 将军',voice:'豪放直率、重情重义；因耳疾声音偏大，却不因此自怜。',goal:'守住江阴、兑现对家人与晚舟的承诺；关键时刻愿意把自己放上战场。'},
  fang:{name:'方亨',tag:'江阴县令 · 外圆内方',voice:'表面圆滑甚至像贪官，实际谨慎、善谋、能忍；对方园尤其克制。',goal:'用伪装和交易护住江阴、方园与密道计划，不让女儿被卷进来。'},
  gu:{name:'顾元方',tag:'面具下的清廷暗线',voice:'审慎、锋利、带压迫感；身份未被揭穿时不轻易暴露真实立场。',goal:'完成潜入与情报任务；仇恨让他越来越难把自己看作局外人。'}
};
const PLAYERS=['冯厚敦','方园','杨玉笙','陈阎芙蓉','赵晚舟','陈稷'];
const ALL=[...Object.values(NPCS).map(x=>x.name),...PLAYERS];
const SCENES=[
  {phase:'第一幕',title:'祭祖与家门',desc:'家人聚在一起，身份、收养与旧日承诺还没有完全说破。',quick:['陈明遇为什么对陈稷这么严厉？','陈明遇会如何安慰芙蓉？','方亨为什么总是把事情说得很圆？']},
  {phase:'第二幕',title:'红豆与密道',desc:'情感和城防开始交叉，阎应元、赵晚舟与家国选择逐渐靠近。',quick:['阎应元会怎样回应赵晚舟？','陈明遇为什么不愿阎应元去扬州？','杨小池怎样看待冯厚敦？']},
  {phase:'第三幕',title:'中秋与面具',desc:'方亨以顾元方的身份回到局中，旧关系需要在面具前重新判断。',quick:['方亨面对方园会说什么？','顾元方会不会暴露真实身份？','杨小池为什么愿意冒险救弟弟？']},
  {phase:'第四幕',title:'城破与选择',desc:'江阴危在旦夕，每个人都要决定把谁留下、把谁送走。',quick:['陈明遇如何阻止阎应元出城？','陈稷会如何面对父亲的阻拦？','如果只能救一个人，杨小池会怎么选？']}
];
const REL={
  '陈明遇|陈稷':{label:'严父与次子',rule:'陈明遇不是不信任陈稷，而是害怕再失去一个儿子。他会压低情绪、强调责任和服从，偶尔因失控露出失去陈黍后的伤口。'},
  '陈明遇|陈阎芙蓉':{label:'慈父与被接纳的女儿',rule:'陈明遇把芙蓉当家人，不把她当外人；语气笨拙温柔，会通过衣物、药材和日常照料表达父爱，不追问她是否符合自己的期待。'},
  '陈明遇|阎应元':{label:'愧疚又护短的兄长',rule:'陈明遇对阎应元像大哥，不是命令式父亲；会担心他的耳疾、补偿他失去骑兵梦想，对他的任性更宽容，但在出城赴死时会爆发。'},
  '陈明遇|杨小池':{label:'保护家人未来的长辈',rule:'他先把杨小池视作玉笙的姐姐，后来确认她与冯厚敦的感情后，把她当作家里人；语气谨慎，更多给退路，不替她做决定。'},
  '陈明遇|方亨':{label:'军政同盟',rule:'两人谈密道、城防和取舍时克制直接，彼此知道对方在冒险；少说家常，多谈布局，但关键处有兄弟般的信任。'},
  '陈明遇|冯厚敦':{label:'试探与护持',rule:'把冯厚敦视作兄弟和年轻时的自己；会用玩笑增加人味，也会留白，不轻易把最危险的计划全部摊开。'},
  '陈明遇|杨玉笙':{label:'长辈与后辈',rule:'更像耐心解释背景的长辈，会给玉笙一个安全位置；不把他的身世当成筹码。'},
  '陈明遇|顾元方':{label:'对面具的戒备',rule:'保持官场礼数和观察，不主动交底；如果察觉异常，会用含蓄试探替代正面质问。'},
  '杨小池|冯厚敦':{label:'相爱却自觉有距离',rule:'她骄傲、勇敢又敏感，面对冯厚敦会护住自己的尊严；爱意通过行动和冒险表达，不撒娇卖惨。'},
  '杨小池|杨玉笙':{label:'姐姐也是半个母亲',rule:'她对玉笙有保护和补偿心理，语气会强硬，做决定时却总把弟弟的生路放在前面。'},
  '阎应元|赵晚舟':{label:'青梅与未尽的白首约',rule:'对晚舟温柔、直接而不善隐藏；声音偏大是耳疾造成的，不是粗鲁；会用红豆、白鹅等记忆回应她。'},
  '阎应元|陈明遇':{label:'三郎与长兄',rule:'阎应元尊敬陈明遇，却不接受用保护之名替他决定命运；关键冲突应有兄弟争执，不是单向服从。'},
  '方亨|方园':{label:'父女与刻意的疏离',rule:'方亨公开场合可能显得冷硬，私下却一直护着方园；会用马蹄酥、安排退路等细节表达，而不是直白煽情。'},
  '方亨|杨玉笙':{label:'交易背后的互救',rule:'方亨以交易和计划说话，同时认可玉笙的判断；危急时刻会把生路交给他，但不把牺牲说成恩情。'},
  '顾元方|方园':{label:'面具与威胁',rule:'顾元方对方园保持压迫和试探，不应突然变成温柔父亲；只有在身份裂缝出现时，才露出被仇恨吞没的悲剧感。'}
};
const state={scene:0,speaker:'chen',listener:'陈稷',history:[],bond:50};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(){return `${NPCS[state.speaker].name}|${state.listener}`}
function relation(){return REL[key()]||{label:'当前关系待建立',rule:`${NPCS[state.speaker].name}会以${NPCS[state.speaker].voice}面对${state.listener}。先通过提问观察对方的防备和情感。`}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function add(name,text,user=false){const box=document.createElement('div');box.className='msg'+(user?' user':'');box.innerHTML=`<div class="avatar ${user?'':'sys'}">${user?'我':esc(name[0]||'系')}</div><div><div class="speaker">${esc(name)}</div><div class="bubble">${esc(text)}</div></div>`;$('#chat').appendChild(box);$('#chat').scrollTop=$('#chat').scrollHeight}
function renderFlow(){$('#flow').innerHTML=SCENES.map((s,i)=>`<button class="scene-btn ${i===state.scene?'active':''}" data-scene="${i}">${s.phase} · ${s.title}<small>${s.desc}</small></button>`).join('');document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{state.scene=+b.dataset.scene;state.history=[];render()})}
function renderSelects(){const speaker=$('#speakerSelect'),listener=$('#listenerSelect');speaker.innerHTML=Object.entries(NPCS).map(([id,p])=>`<option value="${id}" ${id===state.speaker?'selected':''}>${p.name}</option>`).join('');listener.innerHTML=ALL.filter(n=>n!==NPCS[state.speaker].name).map(n=>`<option ${n===state.listener?'selected':''}>${n}</option>`).join('');speaker.onchange=()=>{state.speaker=speaker.value;if(NPCS[state.speaker].name===state.listener)state.listener=ALL.find(n=>n!==NPCS[state.speaker].name);state.history=[];render()};listener.onchange=()=>{state.listener=listener.value;state.history=[];render()}}
function renderNPCs(){$('#npcList').innerHTML=Object.entries(NPCS).map(([id,p])=>`<button class="npc ${id===state.speaker?'active':''}" data-npc="${id}"><div class="avatar">${p.name[0]}</div><div class="meta"><strong>${p.name}</strong><span>${p.tag}</span></div><div class="meter"><i style="width:${state.bond}%"></i></div></button>`).join('');document.querySelectorAll('[data-npc]').forEach(b=>b.onclick=()=>{state.speaker=b.dataset.npc;if(NPCS[state.speaker].name===state.listener)state.listener=ALL.find(n=>n!==NPCS[state.speaker].name);state.history=[];render()})}
function renderRelations(){const r=relation();$('#relationship').innerHTML=`<div class="relation focus"><strong>${r.label}</strong><span>${r.rule}</span></div><div class="relation"><strong>${NPCS[state.speaker].name}的底色</strong><span>${NPCS[state.speaker].voice}</span></div><div class="relation"><strong>此幕目标</strong><span>${NPCS[state.speaker].goal}</span></div>`;$('#relationHint').textContent=`${r.label} · 对话会按关系变调`}
function opening(){const p=NPCS[state.speaker],r=relation();return `${p.name}看向${state.listener}，没有立刻回答。${r.label}让这句话不能只按表面理解——${p.voice.split('；')[0]}。`}
function fallback(q){const n=NPCS[state.speaker].name,r=relation();if(n==='陈明遇'&&state.listener==='陈稷')return `我不是不信你，陈稷。只是这个家已经送走过一个儿子，我不想再看着你把命交给一句“我应该去”。`;
if(n==='陈明遇'&&state.listener==='陈阎芙蓉')return `芙蓉，衣裳合不合身先放一边，家里给你的东西不是施舍。你愿意叫我一声爹，这个家就有你的位置。`;
if(n==='陈明遇'&&state.listener==='阎应元')return `三郎，你要去哪里，我拦不住你；可你这耳朵、这条命，哪一样不是我们一起护过来的？别把我的担心当成软弱。`;
if(n==='陈明遇'&&state.listener==='方亨')return `方兄，城防和密道都可以算，唯独人命不能只算成一笔得失。你既然把方圆交给我，我就不会让她被这盘棋吞掉。`;
if(n==='杨小池'&&state.listener==='杨玉笙')return `玉笙，先活下来，再谈报答。你若把自己交出去换我，我这个姐姐就白替你走了这么多年。`;
if(n==='杨小池'&&state.listener==='冯厚敦')return `冯大人，别用一条命替我做决定。我愿意走到你面前，是因为我认定你，不是因为我需要谁来可怜。`;
if(n==='阎应元'&&state.listener==='赵晚舟')return `晚舟，我声音大，不是要吓你。我只是怕你又站得太远，远到我来不及把那颗红豆交到你手里。`;
if(n==='方亨'&&state.listener==='方园')return `园儿，今日见到的这个人，不一定是你认识的父亲。可你要记住，父亲让你走开，从来不是不要你。`;
if(n==='顾元方'&&state.listener==='方园')return `别再叫我那个名字。你最好站远些——有些人一旦靠近面具，就会连自己想保护的东西也一起看不清。`;
if(q.includes('为什么')||q.includes('害怕'))return `${r.label}里最难说出口的，不是答案，是害怕失去之后还要继续做选择。${r.rule.split('。')[0]}。`;
if(q.includes('关系')||q.includes('家'))return `家不是一句称呼就能决定的。对${state.listener}，我会记得我们一起走过的事，也会保留不能说破的那一部分。`;
return `你问得太直接了。${r.rule.split('。')[0]}；如果你愿意再问一句，我可以告诉你我现在最想护住什么。`}
async function ask(q){const n=NPCS[state.speaker].name,r=relation();add('我',q,true);state.history.push({role:'user',content:q});let answer='';try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:'流芳·关系驱动互动体验',scene:SCENES[state.scene],npc:n,listener:state.listener,relation:r.rule,question:q,clues:[SCENES[state.scene].title,r.label],history:state.history.slice(-8),profile:NPCS[state.speaker]})});const d=await res.json();if(d.ok&&d.answer){answer=d.answer;$('#modelBadge').textContent='本地小模型 · 已接入'}}catch(e){}if(!answer){answer=fallback(q);$('#modelBadge').textContent='关系规则引擎 · 离线兜底'}state.history.push({role:'assistant',content:answer});state.bond=Math.min(99,state.bond+1);renderNPCs();add(n,answer);toast(`${n}对${state.listener}的关系温度：${state.bond}`)}
function render(){const s=SCENES[state.scene];$('#sceneTitle').textContent=`${s.phase} · ${s.title}`;$('#sceneDesc').textContent=s.desc;$('#phaseText').textContent=s.phase;$('#quick').innerHTML=s.quick.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));renderFlow();renderSelects();renderNPCs();renderRelations();$('#chat').innerHTML='';add('系统',`你进入${s.phase}。${s.desc}`);add(NPCS[state.speaker].name,opening())}
$('#composer').onsubmit=e=>{e.preventDefault();const q=$('#input').value.trim();if(q){$('#input').value='';ask(q)}};render();
</script>
