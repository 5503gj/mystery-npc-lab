<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>野菩萨 · 私有情感本试玩</title>
  <style>
    :root{--bg:#120f16;--panel:#201a24;--panel2:#2a202c;--line:#4d3a4e;--text:#f4e9ef;--muted:#ae9eac;--rose:#e5a4b8;--gold:#e4c18a;--green:#9ec8b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#4b263d 0,transparent 33%),radial-gradient(circle at 5% 90%,#24363b 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.65 Inter,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(1440px,calc(100% - 34px));margin:auto;padding:24px 0 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f1c1ce,#a97598);color:#241725;font-weight:800;font-size:20px}.title h1{margin:0;font-size:21px}.title p{margin:2px 0 0;color:var(--muted);font-size:12px}.badges{display:flex;gap:8px;align-items:center}.badge{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#d3c2cf;background:#ffffff08;font-size:11px}.badge.private{color:#f5c9d4;border-color:#93506c;background:#6b294322}.layout{display:grid;grid-template-columns:250px minmax(460px,1fr) 330px;gap:15px}.panel{background:#1b1720dd;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #00000036;backdrop-filter:blur(12px)}.side{padding:18px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--rose);margin-bottom:6px}.case h2{font-size:23px;line-height:1.2;margin:0 0 8px}.case p{font-size:12px;color:var(--muted);margin:0}.divider{height:1px;background:var(--line);margin:17px 0}.flow{display:grid;gap:8px}.flow button,.scene-btn{border:1px solid var(--line);background:#ffffff05;color:#cdbfca;text-align:left;padding:10px;border-radius:12px}.flow button.active,.scene-btn.active{background:#a5507030;border-color:#c97591;color:#fff}.flow small{display:block;color:#8f7f8d;margin-top:2px}.relationship{display:grid;gap:8px}.relation{padding:9px 10px;background:#ffffff05;border:1px solid #ffffff0d;border-radius:11px}.relation strong{display:block;font-size:12px;color:#f2d1da}.relation span{display:block;color:var(--muted);font-size:11px}.center{min-height:735px;display:flex;flex-direction:column;overflow:hidden}.scene-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.scene-head h2{font-size:16px;margin:0}.scene-head p{color:var(--muted);font-size:12px;margin:3px 0 0}.scene-head b{color:var(--gold);font-size:12px;white-space:nowrap}.chat{flex:1;max-height:515px;overflow:auto;padding:20px}.msg{display:flex;gap:10px;margin-bottom:16px;max-width:90%}.msg.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:33px;height:33px;flex:none;border-radius:11px;display:grid;place-items:center;background:#d9a1b4;color:#281825;font-weight:800}.avatar.sys{background:#a6c8bc}.bubble{padding:10px 13px;border:1px solid #ffffff10;border-radius:5px 15px 15px 15px;background:#281e2b;color:#eee2e8}.user .bubble{border-radius:15px 5px 15px 15px;background:#493047;border-color:#8e5678}.speaker{font-size:11px;color:#9f8d9c;margin-bottom:3px}.user .speaker{text-align:right}.quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 14px}.quick button,.send{border:1px solid var(--line);background:#302434;color:#e6d9e0;padding:8px 11px;border-radius:10px;font-size:12px}.quick button:hover{border-color:var(--rose)}.composer{display:flex;gap:9px;padding:14px 20px 19px;border-top:1px solid var(--line)}input{flex:1;min-width:0;background:#120f16;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0}input:focus{border-color:var(--rose)}.send{background:var(--rose);color:#2c1523;border:0;font-weight:700;padding:0 17px}.npc-list{display:grid;gap:8px}.npc{padding:10px;border-radius:13px;border:1px solid transparent;background:#ffffff05;display:flex;align-items:center;gap:9px;text-align:left;color:var(--text);width:100%}.npc.active{border-color:#c06d8b;background:#9d4f7028}.npc .avatar{width:30px;height:30px;border-radius:10px;font-size:12px}.npc div:nth-child(2){min-width:0;flex:1}.npc strong{display:block;font-size:12px}.npc span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter{width:43px;height:5px;background:#493b4b;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--rose);border-radius:99px}.ending{padding:13px;border:1px solid #a67148;background:#8a543622;border-radius:13px;margin:0 20px 15px;display:none}.ending.show{display:block}.ending strong{color:var(--gold)}.ending span{display:block;color:#d7c7c5;font-size:12px;margin-top:3px}.foot{color:#806f7b;text-align:center;font-size:11px;margin-top:14px}.source-note{padding:10px 11px;background:#9b5f7714;border:1px solid #9b5f7733;border-radius:11px;color:#cbb8c2;font-size:11px}@media(max-width:1050px){.layout{grid-template-columns:220px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(max-width:700px){.shell{width:calc(100% - 20px);padding-top:14px}.badges .badge:first-child{display:none}.layout{display:block}.side,.right{margin-bottom:12px}.right{display:block}.center{min-height:730px}.chat{max-height:550px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="mark">菩</div><div class="title"><h1>野菩萨 · 情感本试玩</h1><p>8 人物关系 · 多章节对话 · 私有内容适配版</p></div></div><div class="badges"><span class="badge private">本地私有模式</span><span class="badge" id="modelBadge">规则引擎兜底</span></div></header>
  <main class="layout">
    <aside class="panel side case"><div class="eyebrow">story flow</div><h2>回到长平</h2><p>八个人被 1989 年的火光牵回同一张桌子。你可以选择一个人物，听他/她说话，也可以追问另一个人。</p><div class="divider"></div><div class="flow" id="flow"></div><div class="divider"></div><div class="source-note">这是根据你本地资料提炼的试玩数据，不包含原剧本文字、音频或海报。适合先验证“NPC 是否像这个人”。</div></aside>
    <section class="panel center"><div class="scene-head"><div><h2 id="sceneTitle">回到长平 · 旧日重逢</h2><p id="sceneDesc">车门打开前，所有人都还可以假装自己只是路过。</p></div><b id="phaseText">第一章</b></div><div class="chat" id="chat"></div><div class="ending" id="ending"><strong>关系变化</strong><span id="endingText"></span></div><div class="quick" id="quick"></div><form class="composer" id="composer"><input id="input" placeholder="问当前人物：你最怕谁记起什么？" autocomplete="off"/><button class="send">发送</button></form></section>
    <aside class="panel side right"><div class="eyebrow">cast & bonds</div><h3 style="margin:0 0 11px">选择对话人物</h3><div class="npc-list" id="npcList"></div><div class="divider"></div><h3 style="margin:0 0 11px">当前关系</h3><div class="relationship" id="relationship"></div></aside>
  </main>
  <div class="foot">野菩萨私有试玩版 · 公开发布前必须确认剧本授权，并替换为原创或获授权内容</div>
</div>
<script>
const PEOPLE={
  huangshan:{name:'黄山明',tag:'一生为爱所困',voice:'谨慎、低声、习惯先替别人找理由；谈到爱时会把情绪藏进具体生活细节。',goal:'守住自己认定的那段关系，同时证明自己没有被命运完全打败。',guard:'不愿承认自己既爱又害怕失去，也不愿让人看见自己对权力与安全感的依赖。',relations:[['刘月','前妻 / 权力与感情纠缠'],['黄丽丽','旧日牵引 / 不敢确认的身份'],['毛钧','案件阴影中的敌意']],bond:62},
  huanglili:{name:'黄丽丽',tag:'新时代的摩登女性',voice:'外表轻快、会观察自己；不习惯被定义，谈到过去会先开玩笑再突然认真。',goal:'把自己从旧身份和旧关系里重新拼回来，选择成为自己。',guard:'不愿被当作谁的替身，也不愿承认自己仍然需要某个人的确认。',relations:[['黄山明','旧日情感 / 互相试探'],['张舒','身份疑云 / 不能直接确认'],['朱宝珍','被调查者与观察者']],bond:57},
  tangyigang:{name:'唐亦刚',tag:'胆小鬼',voice:'先用自嘲缓解紧张，真正关键时刻会反复确认“这样做会不会伤害别人”。',goal:'在从众和勇敢之间做一次不再逃避的选择。',guard:'害怕成为加害者，也害怕承认自己曾经站在旁边看。',relations:[['毛钧','童年记忆中的伤害者与被伤害者'],['张舒','旧案的共同目击者'],['刘月','被权力裹挟的证词']],bond:39},
  zhubaozhen:{name:'朱宝珍',tag:'失去一切的贼',voice:'说话快，逻辑清楚，习惯把私人情绪包装成公共目标；越在乎越像在审讯。',goal:'让被掩盖的真相重新进入公共视野，并把未来还给年轻人。',guard:'不愿承认自己也在等待旧人记得自己，而不是只等待正义胜利。',relations:[['李长青','调查者 / 权力对手'],['刘月','追查对象'],['张舒','她想保护的人']],bond:51},
  maojun:{name:'毛钧',tag:'英雄梦',voice:'直白、带着粗粝的自尊；很容易把“保护”说成“我必须做”。',goal:'证明自己不是命运写好的坏人，保护心中仍然柔软的人。',guard:'恐惧自己会重复暴力，也恐惧别人只看见他的罪而看不见挣扎。',relations:[['唐亦刚','童年旧事 / 未完成的道歉'],['刘月','被金钱和案件牵连'],['黄山明','互为危险的镜子']],bond:45},
  zhangshu:{name:'张舒',tag:'瞌睡虫',voice:'温柔、迟缓、像在梦里说话；她把最疼的事情说得像一句愿望。',goal:'让重要的人继续生活，不被自己的离别困住。',guard:'嘴上说希望被忘记，内心却最害怕自己从所有人的人生里消失。',relations:[['黄丽丽','身份与记忆的重叠'],['毛钧','旧案的牵连'],['朱宝珍','被保护与被寻找']],bond:68},
  lichangqing:{name:'李长青',tag:'为半支烟而活的人',voice:'表面圆滑克制，擅长用漂亮话遮住真正的疲惫；在某个人面前会失去官腔。',goal:'在十年里替某段关系赢回一个解释，也替自己争取最后一次面对。',guard:'不承认自己把权力当成了补偿，也不愿承认有些人无法被“接住”。',relations:[['刘月','政商同盟 / 复杂信任'],['朱宝珍','被调查与被理解'],['黄山明','互相利用的旧关系']],bond:43},
  liyue:{name:'刘月',tag:'专一却无爱的人',voice:'冷静、精确、喜欢谈选择和代价；她不轻易说爱，因为她认为爱会削弱控制。',goal:'让自己建立的世界不被过去摧毁，哪怕代价是切断所有关系。',guard:'不愿承认自己害怕失去，也不愿承认某些选择并非完全出于理性。',relations:[['黄山明','婚姻 / 利益 / 未完的爱'],['李长青','权力同盟'],['朱宝珍','她无法控制的调查者']],bond:36}
};
const SCENES=[{title:'回到长平 · 旧日重逢',desc:'车门打开前，所有人都还可以假装自己只是路过。',phase:'第一章',intro:'你面前有八个人。有人在等一个解释，有人在等一个人，有人只想证明自己已经不再是过去的自己。',quick:['你最怕谁记起什么？','如果那年可以重来，你会救谁？','你还相信爱吗？']},{title:'八个箱子 · 记忆开封',desc:'每个箱子里都不是物证，而是一段不愿被别人替你解释的记忆。',phase:'第二章',intro:'箱子被推到桌边。先开哪一个并不重要，重要的是谁会在听见别人故事后改变自己的说法。',quick:['打开关于长平的记忆','问他/她真正想要什么','问谁在撒谎']},{title:'各自的选择 · 最后一问',desc:'情感本的终点不是找出坏人，而是决定自己还要不要继续被过去定义。',phase:'终章',intro:'故事走到最后，每个人都必须把“我为你好”改成“我想为自己选择”。你还有一次不打圆场的提问机会。',quick:['你要留下还是离开？','你真的后悔吗？','你希望别人怎么记住你？']}];
const state={scene:0,current:'huangshan',history:[],bonds:Object.fromEntries(Object.keys(PEOPLE).map(k=>[k,PEOPLE[k].bond]))};
const chat=document.querySelector('#chat'),input=document.querySelector('#input');
function add(name,text,user=false){const el=document.createElement('div');el.className='msg'+(user?' user':'');el.innerHTML=`<div class="avatar ${user?'':'sys'}">${user?'我':(name==='系统'?'菩':PEOPLE[state.current].name[0])}</div><div><div class="speaker">${name}</div><div class="bubble">${text}</div></div>`;chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
function renderFlow(){document.querySelector('#flow').innerHTML=SCENES.map((s,i)=>`<button class="scene-btn ${i===state.scene?'active':''}" data-scene="${i}">${s.phase} · ${s.title.split(' · ')[0]}<small>${s.desc}</small></button>`).join('');document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{state.scene=Number(b.dataset.scene);renderScene()})}
function renderNPCs(){document.querySelector('#npcList').innerHTML=Object.entries(PEOPLE).map(([id,p])=>`<button class="npc ${id===state.current?'active':''}" data-npc="${id}"><div class="avatar">${p.name[0]}</div><div><strong>${p.name}</strong><span>${p.tag}</span></div><div class="meter"><i style="width:${state.bonds[id]}%"></i></div></button>`).join('');document.querySelectorAll('[data-npc]').forEach(b=>b.onclick=()=>{state.current=b.dataset.npc;renderNPCs();renderRelations();add('系统',`你把注意力转向${PEOPLE[state.current].name}。他/她看起来愿意回答，但不代表愿意说真话。`)})}
function renderRelations(){const p=PEOPLE[state.current];document.querySelector('#relationship').innerHTML=p.relations.map(r=>`<div class="relation"><strong>${r[0]}</strong><span>${r[1]}</span></div>`).join('')}
function renderScene(){const s=SCENES[state.scene];document.querySelector('#sceneTitle').textContent=s.title;document.querySelector('#sceneDesc').textContent=s.desc;document.querySelector('#phaseText').textContent=s.phase;document.querySelector('#quick').innerHTML=s.quick.map(q=>`<button data-q="${q}">${q}</button>`).join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));chat.innerHTML='';add('系统',s.intro);add(PEOPLE[state.current].name,opening());renderFlow();renderNPCs();renderRelations()}
function opening(){const p=PEOPLE[state.current];return `${p.name}没有马上看你，只说：“${p.tag}……你想先听哪一部分？”`}
function fallback(q){const p=PEOPLE[state.current];if(q.includes('爱')||q.includes('关系'))return '我不太会解释爱。我更习惯说选择、代价，还有留下以后要承担的东西。';if(q.includes('谁')||q.includes('记起'))return `如果一定要回答，我最不想面对的是${p.relations[0][0]}，因为那个人知道我最不像现在的地方。`;if(q.includes('后悔'))return '后悔不是把事情改回去，而是终于承认当时的自己没有更好的办法。';return '我可以告诉你我愿意让你知道的部分。至于剩下的，等你先说说你为什么要问。'}
async function ask(q){const p=PEOPLE[state.current];add('我',q,true);state.history.push({role:'user',content:q});let answer='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:'野菩萨私有情感本',scene:SCENES[state.scene],npc:p.name,question:q,clues:[SCENES[state.scene].title],history:state.history.slice(-8),profile:p})});const d=await r.json();if(d.ok&&d.answer){answer=d.answer;document.querySelector('#modelBadge').textContent='本地小模型 · 已接入'}}catch(e){}if(!answer){answer=fallback(q);document.querySelector('#modelBadge').textContent='规则引擎兜底'}state.history.push({role:'assistant',content:answer});state.bonds[state.current]=Math.min(99,state.bonds[state.current]+(q.includes('爱')||q.includes('后悔')?2:1));renderNPCs();add(p.name,answer);document.querySelector('#ending').classList.add('show');document.querySelector('#endingText').textContent=`你和${p.name}的关系温度：${state.bonds[state.current]}。继续追问，关系会根据话题慢慢变化。`}
document.querySelector('#composer').onsubmit=e=>{e.preventDefault();const q=input.value.trim();if(q){input.value='';ask(q)}};
renderScene();
</script>
</body>
</html>
